[package]
name = "lov-client"
description = "Client natif de League of Vibes : rendu, FX, interface, audio, entrées."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lov-shared = { path = "../lov-shared" }
# Labo des sorts (`LOV_SPELLLAB`) : la vraie simulation tourne dans le client, comme le fxlab web
# importait celle du serveur. Optionnelle : le jeu livré ne l'embarque pas (il reçoit les snapshots du
# serveur). `cargo run -p lov-client --features spelllab`.
lov-sim = { path = "../lov-sim", optional = true }
bevy = { version = "0.20.1", features = ["bevy_dev_tools", "render_dev_tools", "webp"] }
# `wss://` (serveur hébergé derrière HTTPS) : rustls, sans dépendance système (pas d'OpenSSL), avec les
# racines de certificats embarquées (webpki-roots) pour que le binaire se connecte partout pareil.
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# Fournisseur de chiffrement de rustls : `ring` (tungstenite n'en active aucun). Pas `aws-lc-rs`, qui
# demande cmake et nasm pour compiler sous Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# Labo des sorts : compile `fx::lab` et la simulation `lov-sim` dans le client (outil de développement).
spelllab = ["dep:lov-sim"]
