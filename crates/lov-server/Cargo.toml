[package]
name = "lov-server"
description = "Serveur de League of Vibes : WebSocket, salles, draft, boucle de simulation, snapshots."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lov-shared = { path = "../lov-shared" }
axum = { version = "0.8.9", features = ["ws"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"
