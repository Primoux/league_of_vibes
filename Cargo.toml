# Workspace Rust de League of Vibes (migration en cours, voir AGENTS.md § « Migration vers Rust »).
# Il cohabite avec les paquets TypeScript de `packages/` jusqu'à la bascule.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

# Le moteur de jeu est inutilisable sans optimisation : on optimise les dépendances même en dev,
# et un peu notre code, pour garder des temps de compilation courts.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Release pour tester : optimisé, mais compilé sur tous les cœurs et sans LTO. Une modification du client se
# recompile bien plus vite qu'avec `--release` (une seule unité de code + LTO, réservé au binaire livré).
# `cargo run -p lov-client --profile release-fast`
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
