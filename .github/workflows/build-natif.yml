name: Build natif
# Compile le client natif (crates/lov-client) pour Windows, Linux et macOS et publie les exécutables
# en artefacts du run, à télécharger depuis l'onglet Actions.
#
# Déclenché à la main (Actions → Build natif → Run workflow, sur la branche voulue), et tout seul
# quand une PR modifie ce fichier, pour que le workflow se valide lui-même.
# Sert à mesurer les FPS sur de vraies machines : sous WSL, le rendu passe par le processeur.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/build-natif.yml']

concurrency:
  group: build-natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, bin: lov-client.exe }
          - { os: ubuntu-latest, name: linux, bin: lov-client }
          - { os: macos-latest, name: macos, bin: lov-client }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain épinglé (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bibliothèques système de Bevy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p lov-client
      - uses: actions/upload-artifact@v4
        with:
          name: league-of-vibes-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 14
