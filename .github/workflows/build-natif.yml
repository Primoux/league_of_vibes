name: Build natif
# Compile le jeu pour Windows, Linux et macOS : le client (crates/lov-client) et le serveur
# (crates/lov-server), en archives prêtes à lancer.
#
# - À la main (Actions → Build natif → Run workflow) : archives en artefacts du run.
# - Sur une étiquette `v*` (ex. `git tag v0.3.0 && git push origin v0.3.0`) : publie aussi une
#   release GitHub avec les trois archives.
# - Quand une PR modifie ce fichier, pour que le workflow se valide lui-même.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/build-natif.yml']

concurrency:
  group: build-natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, exe: .exe }
          - { os: ubuntu-latest, name: linux, exe: '' }
          - { os: macos-latest, name: macos, exe: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain épinglé (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bibliothèques système de Bevy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked -p lov-client -p lov-server
      - name: Archive
        shell: bash
        run: |
          dir=league-of-vibes-${{ matrix.name }}
          mkdir "$dir"
          cp target/release/lov-client${{ matrix.exe }} target/release/lov-server${{ matrix.exe }} "$dir/"
          cp README.md ASSETS.md "$dir/"
          printf '%s\n' "# Adresse du serveur de jeu (une ligne). Hôte:port suffit, ex. 192.168.1.20:3000." \
            "# Le serveur est fourni dans cette archive : lance lov-server pour héberger une partie." \
            "ws://localhost:3000/ws" > "$dir/serveur.txt"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: league-of-vibes-${{ matrix.name }}
          path: league-of-vibes-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "League of Vibes $GITHUB_REF_NAME" --generate-notes
