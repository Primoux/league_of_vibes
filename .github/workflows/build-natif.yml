name: Build natif
# Compile le jeu pour Windows, Linux et macOS : le client (crates/lov-client) et le serveur
# (crates/lov-server), en archives prêtes à lancer.
#
# - À la main (Actions → Build natif → Run workflow) : archives en artefacts du run.
# - Quand un patch arrive sur `main` (PR de `scripts/release.sh` : version de `Cargo.toml` + notes dans
#   `docs/patch-notes/patchs.md`) : prépare automatiquement un BROUILLON de release, avec les notes du
#   patch et les trois archives. Un admin le publie (`scripts/release.sh --tag x.y.z`, ou « Publish »
#   sur GitHub), ce qui pose l'étiquette `v*` protégée.
# - Sur une étiquette `v*` poussée à la main : publie la release si elle n'existe pas encore.
# - Quand une PR modifie ce fichier, pour que le workflow se valide lui-même.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'docs/patch-notes/patchs.md']
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/build-natif.yml']

concurrency:
  group: build-natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version de `Cargo.toml` ; sur `main`, faut-il préparer sa release (notes présentes, aucune release) ?
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      draft: ${{ steps.v.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          draft=false
          if [ "$GITHUB_REF" = refs/heads/main ] \
            && grep -q "^# Patch ${version%.0} " docs/patch-notes/patchs.md \
            && ! gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$version"; then
            draft=true
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "version $version, brouillon à préparer : $draft"

  build:
    needs: version
    # sur `main`, seulement quand un patch est à publier
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.version.outputs.draft == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, exe: .exe }
          - { os: ubuntu-latest, name: linux, exe: '' }
          - { os: macos-latest, name: macos, exe: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain épinglé (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bibliothèques système de Bevy (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked -p lov-client -p lov-server
      - name: Archive
        shell: bash
        run: |
          dir=league-of-vibes-${{ matrix.name }}
          mkdir "$dir"
          cp target/release/lov-client${{ matrix.exe }} target/release/lov-server${{ matrix.exe }} "$dir/"
          cp README.md ASSETS.md "$dir/"
          printf '%s\n' "# Adresse du serveur de jeu (une ligne). Hôte:port suffit, ex. 192.168.1.20:3000." \
            "# Le serveur est fourni dans cette archive : lance lov-server pour héberger une partie." \
            "ws://localhost:3000/ws" > "$dir/serveur.txt"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: league-of-vibes-${{ matrix.name }}
          path: league-of-vibes-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.draft == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Version et notes du patch
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::étiquette $GITHUB_REF_NAME, mais Cargo.toml est en $VERSION"; exit 1
          fi
          node scripts/patch-notes.mjs extract "$VERSION" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La release $TAG existe déjà (brouillon publié) : rien à faire."
            exit 0
          fi
          draft=()
          [ "$GITHUB_REF_TYPE" = tag ] || draft=(--draft --target "$GITHUB_SHA")
          gh release create "$TAG" dist/* "${draft[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "League of Vibes $TAG" --notes-file notes.md --generate-notes
