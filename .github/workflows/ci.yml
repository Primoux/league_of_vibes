name: CI
on:
  push:
    branches: [main]
  pull_request:

# Plusieurs machines poussent en parallèle : on annule les runs dépassés d'une même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test de charge (8 bots WebSocket)
        run: |
          PORT=3000 npx tsx packages/server/src/index.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          timeout 120 npx tsx scripts/bots.ts --url ws://localhost:3000/ws --bots 8 --seconds 15
      - name: Logs serveur
        if: always()
        run: cat server.log || true

  areas:
    # Une PR = une area = une issue. Les fichiers de contrat partagés passent par une PR « contract: » seule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Périmètre de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-areas.mjs
      - name: Labels des areas
        # Pose « area:<nom> » pour chaque area déclarée, en réutilisant l'analyse du contrôle
        # ci-dessus (mode --labels) : les labels ne peuvent donc pas diverger du périmètre vérifié.
        # Jamais bloquant : un label raté ne doit pas faire échouer une PR correcte.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          wanted=$(node scripts/check-areas.mjs --labels || true)
          [ -n "$wanted" ] || { echo "Aucune area déclarée, rien à labelliser."; exit 0; }
          existing=$(gh label list --limit 200 --json name -q '.[].name')
          args=()
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            if printf '%s\n' "$existing" | grep -qxF "$label"; then
              args+=(--add-label "$label")
            else
              echo "Label « $label » inexistant (sync-labels le créera au prochain merge sur main)."
            fi
          done <<< "$wanted"
          if [ ${#args[@]} -gt 0 ]; then
            gh pr edit "$PR_NUMBER" "${args[@]}" && echo "Labels posés : ${args[*]//--add-label /}"
          fi

  size:
    # Une PR relisible : au-delà, on découpe. Avertissement seulement, jamais bloquant.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Taille de la PR
        run: |
          lines=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- . \
            ':(exclude)package-lock.json' ':(exclude)*.webp' ':(exclude)*.png' \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Lignes modifiées (hors lock et binaires) : $lines"
          if [ "$lines" -gt 800 ]; then
            echo "::warning::PR de $lines lignes : au-delà de ~800 la relecture devient approximative. Découpe-la si tu peux (AGENTS.md §3)."
          fi
