name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `edited` : changer la base d'une PR (pile reciblée sur main) ou sa ligne `Areas:` relance la CI.
    # Sans lui, les checks affichés restent ceux d'avant le reciblage.
    types: [opened, synchronize, reopened, edited]

# Plusieurs machines poussent en parallèle : on annule les runs dépassés d'une même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Vérifications rapides : format du code Rust, garde-fou des areas et couverture du dépôt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Toolchain épinglé (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: node --test scripts/check-areas.test.ts
      - run: node scripts/check-areas.mjs --audit

  rust:
    # Le jeu : client natif (Bevy) et serveur (tokio + axum), dans `crates/`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain épinglé (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bibliothèques système de Bevy (audio, périphériques, clavier)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test de charge du serveur (8 bots WebSocket, draft compris)
        run: |
          cargo build -p lov-server --example bots
          PORT=3001 DEV_LOBBY=1 target/debug/lov-server > server-rust.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/health && break; sleep 1; done
          timeout 180 target/debug/examples/bots --url ws://localhost:3001/ws --bots 8 --seconds 15
      - name: Logs du serveur Rust
        if: always()
        run: cat server-rust.log || true

  areas:
    # Une PR = une area = une issue. Les fichiers de contrat partagés passent par une PR « contract: » seule.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Périmètre de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-areas.mjs
      - name: Labels des areas
        # Pose « area:<nom> » pour chaque area déclarée, en réutilisant l'analyse du contrôle
        # ci-dessus (mode --labels) : les labels ne peuvent donc pas diverger du périmètre vérifié.
        # Jamais bloquant : un label raté ne doit pas faire échouer une PR correcte.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          wanted=$(node scripts/check-areas.mjs --labels || true)
          [ -n "$wanted" ] || { echo "Aucune area déclarée, rien à labelliser."; exit 0; }
          existing=$(gh label list --limit 200 --json name -q '.[].name')
          args=()
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            if printf '%s\n' "$existing" | grep -qxF "$label"; then
              args+=(--add-label "$label")
            else
              echo "Label « $label » inexistant (sync-labels le créera au prochain merge sur main)."
            fi
          done <<< "$wanted"
          if [ ${#args[@]} -gt 0 ]; then
            gh pr edit "$PR_NUMBER" "${args[@]}" && echo "Labels posés : ${args[*]//--add-label /}"
          fi

  size:
    # Une PR relisible : au-delà, on découpe. Avertissement seulement, jamais bloquant.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Taille de la PR
        run: |
          lines=$(git diff --numstat "origin/${{ github.base_ref }}...HEAD" -- . \
            ':(exclude)Cargo.lock' ':(exclude)*.webp' ':(exclude)*.png' \
            | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "Lignes modifiées (hors lock et binaires) : $lines"
          if [ "$lines" -gt 800 ]; then
            echo "::warning::PR de $lines lignes : au-delà de ~800 la relecture devient approximative. Découpe-la si tu peux (AGENTS.md §3)."
          fi
