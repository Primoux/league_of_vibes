name: Labels
# Les labels « area:* » sont dérivés de .github/areas.json : ajouter une area suffit,
# son label apparaît tout seul. Aucun label n'est supprimé (des issues y sont rattachées).
on:
  push:
    branches: [main]
    paths: ['.github/areas.json', 'scripts/sync-labels.mjs']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-labels.mjs
